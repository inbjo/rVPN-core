name: CLI client and server

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    # 02:00 UTC = 10:00 Asia/Taipei.
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/cli-client.yml
      - rvpn/Cargo.lock
      - rvpn/Cargo.toml
      - rvpn/crates/**
      - rvpn/webui/**
      - DESIGN.md
      - config/**
      - scripts/update_rule_data.py
      - scripts/test_update_rule_data.py
  pull_request:
    paths:
      - .github/workflows/cli-client.yml
      - rvpn/Cargo.lock
      - rvpn/Cargo.toml
      - rvpn/crates/**
      - rvpn/webui/**
      - DESIGN.md
      - config/**
      - scripts/update_rule_data.py
      - scripts/test_update_rule_data.py

permissions:
  contents: read

jobs:
  webui:
    name: Build and test embedded control panel
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rvpn/webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rvpn/webui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: control-panel-ui
          path: rvpn/crates/rvpn-client/ui-dist/index.html
          if-no-files-found: error

  rule_data:
    name: Rule data parser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -B -m unittest discover -s scripts -p 'test_update_rule_data.py'

  windows:
    needs: webui
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rvpn
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      # The workspace's fat LTO / single codegen unit is optimized for size.
      # Thin LTO with parallel codegen shortens CI builds of the CLI.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: control-panel-ui
          path: rvpn/crates/rvpn-client/ui-dist

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies and build outputs
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rvpn -> target
          # Refresh the immutable pre-test cache so both release and ci-test
          # dependency artifacts are captured after the first successful run.
          key: windows-cli-thin-lto-8-ci-test-v1
          cache-bin: "false"

      - name: Report cache lookup
        run: Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Cargo cache exact hit=${{ steps.rust-cache.outputs.cache-hit }}'

      - name: Build Windows CLI client and server
        run: cargo build --release --locked --package rvpn-client --package rvpn-server --bins --timings

      - name: Test configuration and relative paths
        run: cargo test --profile ci-test --locked --package rvpn-client --bin rvpn config::tests --timings

      - name: Test WebSocket control panel
        run: cargo test --profile ci-test --locked --package rvpn-client --bin rvpn control_panel::tests --timings

      - name: Test configuration hot reload and rollback
        run: cargo test --profile ci-test --locked --package rvpn-client --test hot_reload --timings

      - name: Test shared file logging
        run: cargo test --profile ci-test --locked --package rvpn-logging --timings

      - name: Test server file logging
        run: cargo test --profile ci-test --locked --package rvpn-server --test logging --timings

      - name: Test server configuration and relative paths
        run: cargo test --profile ci-test --locked --package rvpn-server --lib config::tests --timings

      - name: Test system TLS trust and certificate verification
        run: cargo test --profile ci-test --locked --package rvpn-tls --lib tls_boring::tests --timings

      - name: Test automatic identity creation
        run: cargo test --profile ci-test --locked --package rvpn-core --lib crypto::key_files --timings

      - name: Test server key initialization
        run: cargo test --profile ci-test --locked --package rvpn-server --lib key_init::tests --timings

      - name: Test client first startup
        run: cargo test --profile ci-test --locked --package rvpn-client --test first_run --timings

      - name: Test server first startup and key rotation
        run: cargo test --profile ci-test --locked --package rvpn-server --test rotation_ceremony --timings

      - name: Upload build timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-windows-x86_64
          path: rvpn/target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Check executable and checksum
        run: |
          $exe = 'target/release/rvpn.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/release/rvpn-server.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  rvpn.exe" | Set-Content target/release/rvpn.exe.sha256 -Encoding ascii
          $hash = (Get-FileHash target/release/rvpn-server.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  rvpn-server.exe" | Set-Content target/release/rvpn-server.exe.sha256 -Encoding ascii

      - name: Stage example configurations
        run: |
          Copy-Item -LiteralPath ../config/client.toml.example -Destination target/release/client.toml.example
          Copy-Item -LiteralPath ../config/server.toml.example -Destination target/release/server.toml.example

      - name: Upload Windows client
        uses: actions/upload-artifact@v7
        with:
          name: rvpn-client-windows-x86_64
          path: |
            rvpn/target/release/rvpn.exe
            rvpn/target/release/rvpn.exe.sha256
            rvpn/target/release/client.toml.example
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows server
        uses: actions/upload-artifact@v7
        with:
          name: rvpn-server-windows-x86_64
          path: |
            rvpn/target/release/rvpn-server.exe
            rvpn/target/release/rvpn-server.exe.sha256
            rvpn/target/release/server.toml.example
          if-no-files-found: error
          compression-level: 0

  unix:
    needs: webui
    name: rvpn-${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
          - runner: macos-15-intel
            artifact: macos-x86_64
          - runner: macos-26
            artifact: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rvpn
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: control-panel-ui
          path: rvpn/crates/rvpn-client/ui-dist

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies and build outputs
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rvpn -> target
          # This cache includes dependencies for both production and ci-test.
          key: cli-thin-lto-8-ci-test-v1-rvpn-${{ matrix.artifact }}
          cache-bin: "false"

      - name: Report cache lookup
        run: echo 'Cargo cache exact hit=${{ steps.rust-cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Build CLI client and server
        run: cargo build --release --locked --package rvpn-client --package rvpn-server --bins --timings

      - name: Test configuration and relative paths
        run: cargo test --profile ci-test --locked --package rvpn-client --bin rvpn config::tests --timings

      - name: Test WebSocket control panel
        run: cargo test --profile ci-test --locked --package rvpn-client --bin rvpn control_panel::tests --timings

      - name: Test configuration hot reload and rollback
        run: cargo test --profile ci-test --locked --package rvpn-client --test hot_reload --timings

      - name: Test shared file logging
        run: cargo test --profile ci-test --locked --package rvpn-logging --timings

      - name: Test server file logging
        run: cargo test --profile ci-test --locked --package rvpn-server --test logging --timings

      - name: Test server configuration and relative paths
        run: cargo test --profile ci-test --locked --package rvpn-server --lib config::tests --timings

      - name: Test system TLS trust and certificate verification
        run: cargo test --profile ci-test --locked --package rvpn-tls --lib tls_boring::tests --timings

      - name: Test automatic identity creation
        run: cargo test --profile ci-test --locked --package rvpn-core --lib crypto::key_files --timings

      - name: Test server key initialization
        run: cargo test --profile ci-test --locked --package rvpn-server --lib key_init::tests --timings

      - name: Test client first startup
        run: cargo test --profile ci-test --locked --package rvpn-client --test first_run --timings

      - name: Test server first startup and key rotation
        run: cargo test --profile ci-test --locked --package rvpn-server --test rotation_ceremony --timings

      - name: Upload build timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-${{ matrix.artifact }}
          path: rvpn/target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Check executable and checksum
        run: |
          set -euo pipefail
          ./target/release/rvpn --version
          ./target/release/rvpn --help >/dev/null
          ./target/release/rvpn-server --help >/dev/null
          if command -v sha256sum >/dev/null; then
            (cd target/release && sha256sum rvpn > rvpn.sha256)
            (cd target/release && sha256sum rvpn-server > rvpn-server.sha256)
          else
            (cd target/release && shasum -a 256 rvpn > rvpn.sha256)
            (cd target/release && shasum -a 256 rvpn-server > rvpn-server.sha256)
          fi

      - name: Stage example configurations
        run: |
          cp ../config/client.toml.example target/release/client.toml.example
          cp ../config/server.toml.example target/release/server.toml.example

      - name: Upload client
        uses: actions/upload-artifact@v7
        with:
          name: rvpn-client-${{ matrix.artifact }}
          path: |
            rvpn/target/release/rvpn
            rvpn/target/release/rvpn.sha256
            rvpn/target/release/client.toml.example
          if-no-files-found: error
          compression-level: 0

      - name: Upload server
        uses: actions/upload-artifact@v7
        with:
          name: rvpn-server-${{ matrix.artifact }}
          path: |
            rvpn/target/release/rvpn-server
            rvpn/target/release/rvpn-server.sha256
            rvpn/target/release/server.toml.example
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release assets
    needs: [rule_data, windows, unix]
    if: >-
      (github.event_name == 'release' && github.event.release.tag_name != 'nightly') ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'push' || github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    concurrency:
      group: release-assets-${{ github.event_name == 'release' && github.event.release.tag_name || 'nightly' }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: rvpn-*
          path: downloads

      - name: Refresh rule data for client archives
        run: python3 -B scripts/update_rule_data.py --output-dir generated-rules

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          count=0
          for dir in downloads/rvpn-*; do
            name="${dir##*/}"
            if [[ "$name" == rvpn-client-* ]]; then
              binary=rvpn
              config=client.toml.example
            elif [[ "$name" == rvpn-server-* ]]; then
              binary=rvpn-server
              config=server.toml.example
            else
              echo "Unexpected artifact: $name" >&2
              exit 1
            fi
            if [[ "$name" == *-windows-* ]]; then
              binary="${binary}.exe"
              (cd "$dir" && sha256sum -c "${binary}.sha256")
              if [[ "$name" == rvpn-client-* ]]; then
                cp -R generated-rules "$dir/rules"
                (cd "$dir" && zip -q -r "${GITHUB_WORKSPACE}/dist/${name}.zip" "$binary" "${binary}.sha256" "$config" rules)
              else
                (cd "$dir" && zip -q -j "${GITHUB_WORKSPACE}/dist/${name}.zip" "$binary" "${binary}.sha256" "$config")
              fi
            else
              (cd "$dir" && sha256sum -c "${binary}.sha256")
              chmod +x "$dir/$binary"
              if [[ "$name" == rvpn-client-* ]]; then
                cp -R generated-rules "$dir/rules"
                tar -czf "dist/${name}.tar.gz" -C "$dir" "$binary" "${binary}.sha256" "$config" rules
              else
                tar -czf "dist/${name}.tar.gz" -C "$dir" "$binary" "${binary}.sha256" "$config"
              fi
            fi
            count=$((count + 1))
          done
          if [[ "$count" -ne 10 ]]; then
            echo "Expected 10 client/server artifacts, found $count" >&2
            exit 1
          fi
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)

      - name: Update nightly prerelease and replace assets
        if: github.event_name != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date_utc="$(date -u +%Y%m%d)"
          tag=nightly
          title="Nightly ${date_utc} (${GITHUB_SHA:0:7})"
          cat > nightly-notes.md <<EOF
          Automated CLI client and server builds for Windows, Linux, and macOS.
          Commit: ${GITHUB_SHA}
          Client archives include refreshed routing rules, source hashes, and upstream license notices.
          Client and server archives each include their corresponding example configuration.
          See SHA256SUMS.txt for archive checksums. TUN routing requires platform-specific setup.
          This prerelease and its assets are replaced by each nightly build.
          EOF

          # Keep the tag aligned with the binaries; never create per-run tags.
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --silent; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" \
              -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="$GITHUB_SHA" --silent
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file nightly-notes.md \
              --prerelease --latest=false
          else
            gh release create "$tag" dist/* --verify-tag \
              --title "$title" --notes-file nightly-notes.md --prerelease --latest=false
          fi

      - name: Remove superseded per-run nightly releases and tags
        if: github.event_name != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq '.[] | select(.prerelease == true) | .tag_name' > old-nightlies.txt
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^nightly-[0-9]{8}-[0-9]+$ ]]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done < old-nightlies.txt

      - name: Replace assets on the published release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber
