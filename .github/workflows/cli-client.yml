name: CLI client and server

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC = 10:00 Asia/Taipei.
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/cli-client.yml
      - rvpn/Cargo.lock
      - rvpn/Cargo.toml
      - rvpn/crates/**
      - scripts/update_rule_data.py
      - scripts/test_update_rule_data.py
  pull_request:
    paths:
      - .github/workflows/cli-client.yml
      - rvpn/Cargo.lock
      - rvpn/Cargo.toml
      - rvpn/crates/**
      - scripts/update_rule_data.py
      - scripts/test_update_rule_data.py

permissions:
  contents: read

jobs:
  rule_data:
    name: Rule data parser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -B -m unittest discover -s scripts -p 'test_update_rule_data.py'

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rvpn
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      # The workspace's fat LTO / single codegen unit is optimized for size.
      # Thin LTO with parallel codegen shortens CI builds of the CLI.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rvpn -> target
          key: windows-cli-thin-lto-8
          cache-bin: "false"

      - name: Build Windows CLI client and server
        run: cargo build --release --locked --package rvpn-client --package rvpn-server --bins

      - name: Check executable and checksum
        run: |
          $exe = 'target/release/rvpn.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/release/rvpn-server.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  rvpn.exe" | Set-Content target/release/rvpn.exe.sha256 -Encoding ascii
          $hash = (Get-FileHash target/release/rvpn-server.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  rvpn-server.exe" | Set-Content target/release/rvpn-server.exe.sha256 -Encoding ascii

      - name: Upload Windows client
        uses: actions/upload-artifact@v7
        with:
          name: rvpn-client-windows-x86_64
          path: |
            rvpn/target/release/rvpn.exe
            rvpn/target/release/rvpn.exe.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows server
        uses: actions/upload-artifact@v7
        with:
          name: rvpn-server-windows-x86_64
          path: |
            rvpn/target/release/rvpn-server.exe
            rvpn/target/release/rvpn-server.exe.sha256
          if-no-files-found: error
          compression-level: 0

  unix:
    name: rvpn-${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
          - runner: macos-15-intel
            artifact: macos-x86_64
          - runner: macos-26
            artifact: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rvpn
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rvpn -> target
          key: cli-thin-lto-8-rvpn-${{ matrix.artifact }}
          cache-bin: "false"

      - name: Build CLI client and server
        run: cargo build --release --locked --package rvpn-client --package rvpn-server --bins

      - name: Check executable and checksum
        run: |
          set -euo pipefail
          ./target/release/rvpn --version
          ./target/release/rvpn --help >/dev/null
          ./target/release/rvpn-server --help >/dev/null
          if command -v sha256sum >/dev/null; then
            (cd target/release && sha256sum rvpn > rvpn.sha256)
            (cd target/release && sha256sum rvpn-server > rvpn-server.sha256)
          else
            (cd target/release && shasum -a 256 rvpn > rvpn.sha256)
            (cd target/release && shasum -a 256 rvpn-server > rvpn-server.sha256)
          fi

      - name: Upload client
        uses: actions/upload-artifact@v7
        with:
          name: rvpn-client-${{ matrix.artifact }}
          path: |
            rvpn/target/release/rvpn
            rvpn/target/release/rvpn.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload server
        uses: actions/upload-artifact@v7
        with:
          name: rvpn-server-${{ matrix.artifact }}
          path: |
            rvpn/target/release/rvpn-server
            rvpn/target/release/rvpn-server.sha256
          if-no-files-found: error
          compression-level: 0

  nightly:
    name: Publish nightly release
    needs: [rule_data, windows, unix]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: rvpn-*
          path: downloads

      - name: Refresh rule data for client archives
        run: python3 -B scripts/update_rule_data.py --output-dir generated-rules

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          count=0
          for dir in downloads/rvpn-*; do
            name="${dir##*/}"
            if [[ "$name" == rvpn-client-* ]]; then
              binary=rvpn
            elif [[ "$name" == rvpn-server-* ]]; then
              binary=rvpn-server
            else
              echo "Unexpected artifact: $name" >&2
              exit 1
            fi
            if [[ "$name" == *-windows-* ]]; then
              binary="${binary}.exe"
              (cd "$dir" && sha256sum -c "${binary}.sha256")
              if [[ "$name" == rvpn-client-* ]]; then
                cp -R generated-rules "$dir/rules"
                (cd "$dir" && zip -q -r "${GITHUB_WORKSPACE}/dist/${name}.zip" "$binary" "${binary}.sha256" rules)
              else
                (cd "$dir" && zip -q -j "${GITHUB_WORKSPACE}/dist/${name}.zip" "$binary" "${binary}.sha256")
              fi
            else
              (cd "$dir" && sha256sum -c "${binary}.sha256")
              chmod +x "$dir/$binary"
              if [[ "$name" == rvpn-client-* ]]; then
                cp -R generated-rules "$dir/rules"
                tar -czf "dist/${name}.tar.gz" -C "$dir" "$binary" "${binary}.sha256" rules
              else
                tar -czf "dist/${name}.tar.gz" -C "$dir" "$binary" "${binary}.sha256"
              fi
            fi
            count=$((count + 1))
          done
          if [[ "$count" -ne 10 ]]; then
            echo "Expected 10 client/server artifacts, found $count" >&2
            exit 1
          fi
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date_utc="$(date -u +%Y%m%d)"
          tag="nightly-${date_utc}-${GITHUB_RUN_ID}"
          gh release create "$tag" dist/* \
            --title "Nightly ${date_utc} (${GITHUB_SHA:0:7})" \
            --notes "Automated CLI client and server builds for Windows, Linux, and macOS. Client archives include freshly converted rules, source hashes, and upstream license notices; server archives contain only the server binary. See SHA256SUMS.txt for archive checksums. TUN routing requires platform-specific setup." \
            --prerelease --target "$GITHUB_SHA"
