name: Windows CLI client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-client.yml
      - rvpn/Cargo.lock
      - rvpn/Cargo.toml
      - rvpn/crates/**
  pull_request:
    paths:
      - .github/workflows/windows-client.yml
      - rvpn/Cargo.lock
      - rvpn/Cargo.toml
      - rvpn/crates/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rvpn
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      # The workspace's fat LTO / single codegen unit is optimized for size.
      # Thin LTO with parallel codegen shortens CI builds of the CLI.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rvpn -> target
          key: windows-cli-thin-lto-8
          cache-bin: "false"

      - name: Build Windows CLI
        run: cargo build --release --locked --package rvpn-client --bin rvpn

      - name: Check executable and checksum
        run: |
          $exe = 'target/release/rvpn.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  rvpn.exe" | Set-Content target/release/rvpn.exe.sha256 -Encoding ascii

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-windows-x86_64-cli
          path: |
            rvpn/target/release/rvpn.exe
            rvpn/target/release/rvpn.exe.sha256
          if-no-files-found: error
          compression-level: 0
